name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # TEMPORARY: raised from 20 for the per-file timing diagnostic below ONLY.
    # A job-level cap overrides a step-level one, so leaving this at 20 would kill
    # the diagnostic before it finishes and produce zero data again (a cancelled
    # job also discards its logs). MUST go back to 20 together with the diagnostic
    # steps — the point is to find and fix the cost, not to normalise a slower CI.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # dsh 沙盒集成用例要在 runner 上真跑 bwrap:ubuntu-24.04 默认
      # kernel.apparmor_restrict_unprivileged_userns=1 且 bubblewrap 包不带
      # AppArmor profile,bwrap 一起 userns 就秒退("setting up uid map:
      # Permission denied",exit 1)。这里放开限制并预装 bubblewrap,让沙盒
      # 用例在 CI 上真正执行。整步 best-effort:哪一步失败都不阻塞——测试侧
      # 有 bwrap 运行时探测 gate,跑不了会 loud skip 而不是超时挂掉。
      - name: Enable bwrap sandbox for integration tests (best-effort)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v bwrap >/dev/null || sudo apt-get install -y bubblewrap || true
          if bwrap --bind / / --unshare-user -- /bin/true 2>/dev/null; then
            echo "bwrap userns OK — sandbox integration tests will run for real"
          else
            echo "bwrap still unavailable — sandbox integration tests will skip (see test-side gate)"
          fi

      - run: npm install -g pnpm@9.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # TEMPORARY DIAGNOSTIC (remove once the cost centre is known).
      #
      # This job was cancelled at its 20-minute timeout with `pnpm test` at
      # 23m48s+, while the same suite takes 8m07s on a current-master branch and
      # took 6m08s on this branch on Aug 22. Local investigation could not find the
      # extra ~16 minutes: every file measured was either unchanged from master or
      # ≤2s, and the box cannot run the full suite (OOM) and has 64 cores against
      # this runner's 2-4, so local numbers do not extrapolate.
      #
      # So measure HERE. `--reporter=json` cannot help: it writes only at the end
      # of a run, and a cancelled job discards its logs too (the logs API returns
      # BlobNotFound), which is why the first timeout produced zero data. The
      # custom reporter appends one line per file AS EACH FILE FINISHES, verified
      # to survive SIGKILL, so even a re-timeout leaves a usable ranking.
      #
      # `continue-on-error` + a raised timeout so the run reaches the end and the
      # ranking is complete; the summary step below prints the slowest files.
      # Known-failing-before-this-branch specs (v3-goal-cli, plugin-mcp-sandbox,
      # worker-dsh-turn) must not mask the timing data, hence not gating here.
      - name: Test with per-file timing (diagnostic)
        id: timed_test
        continue-on-error: true
        timeout-minutes: 45
        env:
          BOTMUX_TEST_TIMING_FILE: ${{ runner.temp }}/test-timing.tsv
        run: pnpm exec vitest run --project unit --reporter=./scripts/vitest-timing-reporter.mjs

      - name: Slowest test files (diagnostic)
        if: always()
        run: |
          F="${{ runner.temp }}/test-timing.tsv"
          if [ ! -s "$F" ]; then echo "no timing data captured"; exit 0; fi
          echo "files recorded: $(wc -l < "$F")"
          echo "total wall across files: $(awk -F'\t' '{s+=$2} END {printf "%.1f min", s/60000}' "$F")"
          echo
          echo "=== slowest 40 ==="
          sort -t$'\t' -k2 -rn "$F" | head -40 | awk -F'\t' '{printf "%8.1fs  %-8s %s\n", $2/1000, $3, $4}'
          echo
          echo "=== non-passing ==="
          awk -F'\t' '$3!="passed"' "$F" | awk -F'\t' '{printf "%8.1fs  %-8s %s\n", $2/1000, $3, $4}'

      - name: Upload timing data (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing
          path: ${{ runner.temp }}/test-timing.tsv
          if-no-files-found: warn
          retention-days: 7

      - run: pnpm workflow-core:test

  # The Bun single-file executable is a SHIPPED artifact (attached to every
  # GitHub Release), but until this job existed nothing built or ran it before a
  # tag push — so `bun build --compile` breakage was only discovered at release
  # time, after npm had already published. Two real defects reached that far:
  #   • the compiled dashboard crashlooped on a deep `require()` the bundler
  #     never embedded (qrcode-terminal/vendor), and
  #   • the dashboard had no supervisor launcher at all.
  # Neither is visible to `pnpm test` (vitest runs the Node path) nor to a
  # `capabilities --json` canary. This job compiles the host-arch binary and runs
  # scripts/smoke-bun-binary.mjs, which exercises the layers that actually carry
  # Bun-migration risk: the hidden self-spawn entries, the supervised dashboard
  # member booting with its embedded modules, and its HTTP listener.
  #
  # Kept a separate job (not steps appended to `build`) so a Bun-only failure is
  # legible at a glance and does not mask unit-test results.
  bun-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Same pin as the release job's bun-binaries matrix — CI must exercise the
      # exact Bun that will build the shipped artifact, or this gate proves nothing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: npm install -g pnpm@9.5.0
      # The platform's own install compiles node-pty's build/Release/pty.node for
      # this OS/arch, which the embed plugin bundles into the binary.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Compile the host-arch Bun binary
        run: bun scripts/build-bun-binary.mjs --target bun-linux-x64 --out dist-bin/botmux-linux-x64

      - name: Smoke-test the compiled binary
        # Runs from a scratch HOME with an empty bots.json — no Feishu
        # credentials, no live fleet, no interference with anything on the runner.
        #
        # The empty bots.json is why checks 1-4 cannot reach the daemon: it refuses
        # to start with 0 bots ("Invalid BOTMUX_BOT_INDEX=0"), so writePidFile —
        # and the wrapper write that once overwrote the binary itself — is
        # structurally unreachable. Check 5 in the script covers that path directly
        # instead of booting a credentialed bot.
        run: node scripts/smoke-bun-binary.mjs dist-bin/botmux-linux-x64

